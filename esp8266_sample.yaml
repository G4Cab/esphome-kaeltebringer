esphome:
  name: kaeltebringer
  friendly_name: Kältebringer

esp8266:
  board: esp_wroom_02

external_components:
  - source:
      url: https://github.com/G4Cab/esphome-kaeltebringer
      type: git
    components: [kaeltebringer]

logger:
  # baud_rate: 0 # disable logging on uart

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Kaltebringer Martin Fallback
    password: !secret wifi_password

api:
  encryption:
    key: !secret kaeltebringer__encryption_key

ota:
  - platform: esphome
    encryption:

status_led:
    pin: GPIO5

uart:
  id: uart_bus
  tx_pin: 15
  rx_pin: 13
  baud_rate: 9600
  parity: EVEN

climate:
  - platform: kaeltebringer
    id: klima
    uart_id: uart_bus
    name: "HVAC Kaeltebringer"
    beep_enabled: false

captive_portal:

select:
  - platform: template
    name: "Lamellen vertikal"
    id: lamellen_vertikal
    update_interval: 10s
    options: ["Swing", "Ganz oben", "Oben", "Mitte", "Unten", "Ganz unten"]
    lambda: |-
      auto p = id(klima)->get_vertical_position();
      if (p.empty()) return {};
      return p;
    set_action:
      - lambda: id(klima)->set_vertical_position(x);
